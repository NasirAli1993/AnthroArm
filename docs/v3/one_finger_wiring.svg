<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1800 1030" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
<title id="title">One-finger bench prototype wiring</title><desc id="desc">USB camera connects to PC, PC to Arduino UNO R3 by USB. D9 sends the servo command. A separate regulated 6 volt supply powers the servo through a fuse and a DC-rated latching motor-power stop. Servo, supply and Arduino share ground. No positive servo power connects to the Arduino.</desc>
<defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#edf4f4}.title{font-size:34px;font-weight:600}.sub{font-size:20px;fill:#a4b9bf}.label{font-size:23px;font-weight:600}.small{font-size:18px;fill:#bdcdd1}.tiny{font-size:16px;fill:#a4b9bf}.box{fill:#19292e;stroke:#446168;stroke-width:2}.usb{fill:none;stroke:#62dbc0;stroke-width:5}.sig{fill:none;stroke:#edc271;stroke-width:5}.power{fill:none;stroke:#ff8a80;stroke-width:6}.gnd{fill:none;stroke:#9baeb5;stroke-width:5}</style><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="#62dbc0"/></marker></defs>
<rect width="1800" height="1030" fill="#101719"/>
<text x="55" y="60" class="title">One finger: separate control, motor power and mechanics</text>
<text x="55" y="94" class="sub">Low-voltage bench connection plan · Candidate hardware · Assemble and verify before applying power</text>
<rect x="55" y="168" width="220" height="145" rx="16" class="box"/><text x="80" y="209" class="label">USB camera</text><text x="80" y="246" class="small">Optional for first test</text><text x="80" y="275" class="tiny">PC supplies camera power</text>
<rect x="410" y="168" width="250" height="145" rx="16" class="box"/><text x="435" y="209" class="label">Windows PC</text><text x="435" y="246" class="small">Vision / serial bridge</text><text x="435" y="275" class="tiny">All project files on D:</text>
<path d="M275 231 H410" class="usb" marker-end="url(#arrow)"/><text x="316" y="210" class="tiny">USB</text>
<rect x="825" y="150" width="310" height="205" rx="16" class="box"/><text x="850" y="191" class="label">Arduino UNO R3</text><text x="850" y="228" class="small">USB-powered 5 V logic</text><text x="850" y="259" class="tiny">Boot: disarmed · D9 signal</text><text x="850" y="290" class="tiny">No motor current through board</text><text x="850" y="326" class="tiny">GND</text>
<path d="M660 231 H825" class="usb" marker-end="url(#arrow)"/><text x="685" y="203" class="tiny">USB-B data + 5 V</text>
<rect x="1420" y="276" width="325" height="265" rx="16" class="box"/><text x="1446" y="318" class="label">Hitec D645MW</text><text x="1446" y="351" class="small">One tendon / one servo</text><text x="1446" y="389" class="tiny" style="fill:#edc271">S · PWM command</text><text x="1446" y="444" class="tiny" style="fill:#ff8a80">+ · Dedicated 6.0 V supply</text><text x="1446" y="499" class="tiny">− · GND return</text>
<path d="M1135 231 H1300 V383 H1420" class="sig"/><text x="1170" y="211" class="tiny" style="fill:#edc271">D9 → servo S</text><text x="1153" y="270" class="tiny">Signal only</text>
<rect x="55" y="548" width="285" height="162" rx="16" class="box"/><text x="80" y="589" class="label">Regulated DC supply</text><text x="80" y="626" class="small">Set 6.0 V, current limited</text><text x="80" y="659" class="tiny">External enclosed bench supply</text><text x="80" y="689" class="tiny">Mains wiring is not shown</text>
<rect x="465" y="532" width="185" height="100" rx="12" class="box"/><text x="491" y="572" class="label">F1 · Fuse</text><text x="491" y="605" class="tiny">Value to be sized</text>
<rect x="835" y="532" width="285" height="100" rx="12" fill="#392a2a" stroke="#ac6b64" stroke-width="2"/><text x="860" y="572" class="label">S1 · Motor stop</text><text x="860" y="605" class="tiny">Latching, normally closed</text>
<path d="M340 582 H465 M650 582 H835 M1120 582 H1242 V438 H1420" class="power"/>
<text x="362" y="560" class="tiny" style="fill:#ff8a80">+6 V</text><text x="662" y="519" class="tiny">DC motor-load rated contacts</text>
<path d="M340 674 H385 V778 H1345 V493 H1420 M976 355 V778" class="gnd"/>
<circle cx="976" cy="778" r="8" fill="#c3d0d4"/><text x="759" y="815" class="small">Shared ground: supply −, servo −, UNO GND</text><text x="525" y="752" class="tiny">Servo return runs directly to supply ground</text>
<rect x="55" y="872" width="1690" height="115" rx="14" fill="#1a2427" stroke="#446168"/><text x="80" y="907" class="small">Motor power does not connect to UNO 5V, VIN or an I/O pin. Confirm connector labels; do not rely on wire colors alone.</text><text x="80" y="938" class="small">F1, wire gauge, connectors and S1 DC motor-load rating must match measured current and the supply's fault capability.</text><text x="80" y="969" class="tiny">A software watchdog only stops command pulses. S1 physically interrupts servo power. This is a bench prototype plan, not a certified machine safety circuit.</text>
</svg>
